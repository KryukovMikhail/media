<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDIA — книги, фильмы, музыка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f13; --bg2:#16181f; --card:#1b1e27; --line:#2a2e3a;
  --text:#ecedf1; --muted:#8d93a5; --accent:#ff7a1a; --accent2:#ffb15c;
  --good:#3bb33b; --mid:#8d93a5; --bad:#e24a4a; --imdb:#f5c518;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(14,15,19,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:20px;height:64px}
.logo{font-weight:800;letter-spacing:.18em;font-size:20px;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap}
nav a.on{background:var(--text);color:var(--bg)}
.sp{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;color:var(--muted)}
.iconbtn.on{border-color:var(--accent);color:var(--accent)}

/* hero */
.hero{padding:28px 0 8px}
.hero h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:800}
.hero p{margin:6px 0 0;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:13px}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 12px}
.search{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
.search:focus{border-color:var(--accent)}
select{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.btn{background:var(--accent);color:#111;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--bg2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}

.tags{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tagrow small{color:var(--muted);width:90px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:600}
.chip em{font-style:normal;opacity:.6;margin-left:4px}
.clear{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px}

.banner{background:#2b1d10;border:1px solid #5a3a17;color:var(--accent2);border-radius:12px;padding:12px 14px;margin:16px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner span{flex:1;min-width:200px;font-size:14px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;padding-bottom:60px}
.card{cursor:pointer;border-radius:var(--r);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--card)}
.poster img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.poster img.ok{opacity:1}
.poster .my{z-index:2}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.ph b{font-size:56px;font-weight:800;opacity:.35;line-height:1}
.ph span{font-weight:700;font-size:15px;margin-top:6px}
.my{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);border-radius:8px;padding:3px 8px;font-weight:700;font-size:13px}
.my.wish{color:var(--accent2)}
.card h3{margin:10px 0 2px;font-size:15px;line-height:1.3}
.card .sub{color:var(--muted);font-size:13px}
.rates{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rate{font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px;text-decoration:none}
.rate.kp{background:#232326}
.rate.imdb{background:var(--imdb);color:#111}
.g{color:var(--good)}.m{color:var(--mid)}.b{color:var(--bad)}
.found{color:var(--muted);font-size:13px;margin:-8px 0 12px;min-height:4px}
.more{text-align:center;margin:-30px 0 60px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
.soon{text-align:center;padding:80px 16px;color:var(--muted)}
.soon h2{color:var(--text);font-size:28px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px;max-width:820px;width:100%;position:relative}
.mx{position:absolute;top:10px;right:10px;z-index:2}
.det{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px}
.det .poster{width:100%}
.det h2{margin:0;font-size:26px}
.det .orig{color:var(--muted);margin-top:4px}
.tagline{font-style:italic;color:var(--accent2);margin:6px 0 2px}
.br .votes{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.olbl{display:inline-block;min-width:44px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.meta{color:var(--muted);font-size:14px;margin:12px 0;line-height:1.6}
.meta b{color:var(--text);font-weight:500}
.bigrates{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.br{border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-decoration:none;min-width:88px}
.br small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.br b{font-size:20px}
.sec h4{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sec p{margin:0;line-height:1.6;white-space:pre-wrap}
.review{border-left:3px solid var(--accent);padding-left:12px}
.dtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mactions{display:flex;gap:8px;margin-top:20px}

/* form */
form{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
form h2{grid-column:1/-1;margin:0 0 4px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.full{grid-column:1/-1}
form input,form textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;color:var(--text)}
form input:focus,form textarea:focus{border-color:var(--accent)}
form textarea{min-height:90px;resize:vertical}
.sugg{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.sugg .chip{font-size:12px;padding:3px 9px}
.hint{font-size:12px;color:var(--muted)}
.factions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* фон из постеров */
.bgwall{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:var(--bg)}
.bgwall .tilt{position:absolute;left:-20%;top:-30%;width:140%;height:160%;transform:rotate(-12deg);display:flex;flex-direction:column;gap:14px;opacity:.8}
.bgwall .row{display:flex;gap:14px;width:max-content;animation:bgL var(--d,160s) linear infinite}
.bgwall .row:nth-child(even){animation-name:bgR}
.bgwall img{width:150px;height:225px;object-fit:cover;border-radius:12px;flex:none;background:var(--card)}
@keyframes bgL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bgR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.bgwall::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(14,15,19,.35) 0,rgba(14,15,19,.55) 260px,rgba(14,15,19,.86) 560px,rgba(14,15,19,.94) 900px),
  radial-gradient(ellipse 120% 80% at 50% 0%,transparent 40%,rgba(14,15,19,.6))}
@media (prefers-reduced-motion:reduce){.bgwall .row{animation:none}}
body{background:transparent}
html{background:var(--bg)}
.hero h1{text-shadow:0 2px 24px rgba(0,0,0,.6)}
.stat,.search,select,.chip,.btn.ghost{backdrop-filter:blur(6px)}
.stat{background:rgba(22,24,31,.82)}
.build{opacity:.6;margin-left:8px;font-variant-numeric:tabular-nums}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:20px 0 30px}

@media (max-width:640px){
  .hdr{gap:10px}
  .logo{font-size:17px}
  nav a{padding:7px 10px;font-size:14px}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .det{grid-template-columns:1fr;padding:18px}
  .det .poster{max-width:200px}
  form{grid-template-columns:1fr;padding:18px}
  .tagrow small{width:100%}
}
</style>
</head>
<body>
<header><div class="wrap hdr">
  <a class="logo" href="#movies"><i></i>MEDIA</a>
  <nav id="nav"></nav>
  <div class="sp"></div>
  <button class="iconbtn" id="editToggle" title="Режим редактирования">✎</button>
</div></header>

<main class="wrap" id="app"></main>
<div class="bgwall" aria-hidden="true"><div class="tilt" id="bgTilt"></div></div>
<footer><div class="wrap">Михаил Крюков · личная медиатека <span class="build" id="build"></span></div></footer>
<div id="modal"></div>

<script src="data/movies.js"></script>
<script src="data/books.js"></script>
<script src="data/music.js"></script>
<script>
/* ======== НАСТРОЙКИ ======== */
const BUILD = "M001.004";   // номер сборки: M<мажор>.<сборка>
const SECTIONS = {
  movies:{ title:"Фильмы", varName:"MEDIA_MOVIES", file:"movies.js", wish:"посмотреть", unit:"фильмов и сериалов",
    tagGroups:[
      ["Тип",    ["фильм","сериал","мини-сериал","анимация","мультсериал","аниме","документальный","короткометражка"]],
      ["Жанр",   ["драма","комедия","фантастика","фэнтези","триллер","детектив","криминал","ужасы","боевик","приключения","семейный","детский","история","биография","военный","спорт","мелодрама","мюзикл","музыка","вестерн","фильм-нуар","концерт","реальное ТВ","ток-шоу","игра","новости"]],
      ["Статус", ["любимые","посмотреть","смотрю","пересмотреть"]]
    ], otherLabel:"Мои списки"},
  books:{ title:"Книги", varName:"MEDIA_BOOKS", file:"books.js", wish:"прочитать", unit:"книг",
    tagGroups:[
      ["Тип",    ["роман","повесть","рассказы","нон-фикшн","биография","поэзия"]],
      ["Жанр",   ["классика","фантастика","фэнтези","детектив","история","психология","бизнес","саморазвитие","IT","спорт"]],
      ["Списки", ["любимые","прочитать","перечитать"]]
    ]},
  music:{ title:"Музыка", soon:true }
};
const ORDER = ["books","movies","music"];

/* ======== СОСТОЯНИЕ ======== */
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null }catch(e){ return null } }
function lsSet(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }

const data = {};
const drafts = {};
for (const s of ["movies","books"]) {
  const d = lsGet("media_draft_"+s);
  drafts[s] = !!d;
  data[s] = d || (window[SECTIONS[s].varName] || []);
}
const PAGE = 60;
const st = { sec:"movies", q:"", tags:new Set(), sort:"added", status:"all", edit: !!lsGet("media_edit"), limit:PAGE };

/* ======== УТИЛИТЫ ======== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;
const num = v => (v===""||v==null||isNaN(+v)) ? null : +v;
const cls = v => v==null ? "m" : v>=7 ? "g" : v>=5 ? "m" : "b";
const fmt = v => v==null ? "—" : (+v).toFixed(1);
function hue(str){ let h=0; for (const c of str) h=(h*31+c.charCodeAt(0))%360; return h; }

function kpUrl(x){ return x.kpId ? `https://www.kinopoisk.ru/film/${enc(x.kpId)}/` : `https://www.kinopoisk.ru/index.php?kp_query=${enc((x.title||"")+" "+(x.year||""))}`; }
function imdbUrl(x){ return x.imdbId ? `https://www.imdb.com/title/${enc(x.imdbId)}/` : `https://www.imdb.com/find/?q=${enc((x.titleEn||x.original||x.title||"")+(x.year?" "+x.year:""))}&s=tt`; }
function llUrl(x){ return x.livelib || `https://www.livelib.ru/find/${enc((x.title||"")+" "+(x.author||""))}`; }

function posterHTML(x){
  const h = hue(x.title||"?");
  const ph = `<div class="ph" style="background:linear-gradient(160deg,hsl(${h} 45% 28%),hsl(${(h+50)%360} 40% 12%))"><b>${esc((x.title||"?")[0])}</b><span>${esc(x.title)}</span></div>`;
  const src = x.poster || (x.kpId ? `https://st.kp.yandex.net/images/film_big/${enc(x.kpId)}.jpg` : "");
  return src ? ph + `<img src="${esc(src)}" alt="" loading="lazy" onload="this.classList.add('ok')" onerror="this.remove()">` : ph;
}
const isWish = (x,s) => (x.tags||[]).includes(SECTIONS[s].wish);

/* ======== РЕНДЕР ======== */
function renderNav(){
  $("#nav").innerHTML = ORDER.map(k => `<a href="#${k}" class="${k===st.sec?"on":""}">${SECTIONS[k].title}</a>`).join("");
  $("#editToggle").classList.toggle("on", st.edit);
}

function filtered(){
  const list = data[st.sec] || [];
  const q = st.q.trim().toLowerCase();
  let r = list.filter(x => {
    if (st.tags.size && ![...st.tags].every(t => (x.tags||[]).includes(t))) return false;
    if (st.status!=="all" && (st.status==="wish") !== isWish(x,st.sec)) return false;
    if (!q) return true;
    return [x.title,x.titleEn,x.original,x.author,x.director,x.year,(x.tags||[]).join(" ")].join(" ").toLowerCase().includes(q);
  });
  const key = {
    added: x => x.added || "",
    my:    x => num(x.my) ?? -1,
    kp:    x => num(x.kpRating) ?? -1,
    imdb:  x => num(x.imdbRating) ?? -1,
    year:  x => num(x.year) ?? -1
  }[st.sort];
  if (st.sort === "title") r.sort((a,b)=>(a.title||"").localeCompare(b.title||"","ru"));
  else r.sort((a,b)=> key(a)<key(b)?1:key(a)>key(b)?-1:0);
  return r;
}

function render(){
  renderNav();
  const S = SECTIONS[st.sec], app = $("#app");
  if (S.soon) {
    app.innerHTML = `<div class="soon"><h2>Музыка</h2><p>Раздел в разработке — скоро здесь будут альбомы и исполнители.</p></div>`;
    return;
  }
  const list = data[st.sec];
  const done = list.filter(x=>!isWish(x,st.sec));
  const rated = done.filter(x=>num(x.my)!=null);
  const avg = rated.length ? (rated.reduce((a,x)=>a+ +x.my,0)/rated.length).toFixed(1) : "—";
  const fav = list.filter(x=>(x.tags||[]).includes("любимые")).length;

  // теги: группы из настроек + "Другое"
  const counts = {};
  list.forEach(x => (x.tags||[]).forEach(t => counts[t]=(counts[t]||0)+1));
  const known = new Set(S.tagGroups.flatMap(g=>g[1]));
  const groups = S.tagGroups.map(([g,ts]) => [g, ts.filter(t=>counts[t])]);
  const other = Object.keys(counts).filter(t=>!known.has(t)).sort((a,b)=>a.localeCompare(b,"ru"));
  if (other.length) groups.push([S.otherLabel||"Другое", other]);
  const chip = t => `<button class="chip ${st.tags.has(t)?"on":""}" data-tag="${esc(t)}">${esc(t)}<em>${counts[t]}</em></button>`;

  const draftBanner = drafts[st.sec] ? `<div class="banner"><span>Есть изменения, сохранённые только в этом браузере. Выгрузи файл <b>${S.file}</b> и загрузи его в папку <b>data/</b> репозитория.</span>
      <button class="btn" data-act="export">Скачать ${S.file}</button><button class="btn ghost" data-act="copy">Копировать</button><button class="btn danger" data-act="reset">Сбросить</button></div>` : "";

  const items = filtered();
  app.innerHTML = `
    <section class="hero">
      <h1>${S.title}</h1>
      <div class="stats">
        <div class="stat"><b>${done.length}</b><span>${st.sec==="books"?"прочитано":"просмотрено"}</span></div>
        <div class="stat"><b>${list.length-done.length}</b><span>в планах</span></div>
        <div class="stat"><b>${fav}</b><span>любимых</span></div>
        <div class="stat"><b>${avg}</b><span>средняя оценка</span></div>
      </div>
    </section>
    ${draftBanner}
    <div class="toolbar">
      <input class="search" id="q" placeholder="Поиск по названию, ${st.sec==="books"?"автору":"режиссёру"}, тегам…" value="${esc(st.q)}">
      <select id="status">
        ${[["all","Все"],["done",st.sec==="books"?"Прочитанные":"Просмотренные"],["wish","В планах"]].map(([v,t])=>`<option value="${v}" ${st.status===v?"selected":""}>${t}</option>`).join("")}
      </select>
      <select id="sort">
        ${[["added","Недавно добавленные"],["my","Моя оценка"],...(st.sec==="movies"?[["kp","Кинопоиск"],["imdb","IMDb"]]:[]),["year","Год"],["title","Название"]]
          .map(([v,t])=>`<option value="${v}" ${st.sort===v?"selected":""}>${t}</option>`).join("")}
      </select>
      ${st.edit?`<button class="btn" data-act="add">+ Добавить</button>`:""}
    </div>
    <div class="tags">
      ${groups.filter(g=>g[1].length).map(([g,ts])=>`<div class="tagrow"><small>${g}</small>${ts.map(chip).join("")}</div>`).join("")}
      ${st.tags.size?`<div><button class="clear" data-act="clear">Сбросить фильтры ×</button></div>`:""}
    </div>
    <div class="found">${items.length!==list.length?`Найдено: ${items.length}`:""}</div>
    <div class="grid">${items.length ? items.slice(0,st.limit).map(card).join("") : `<div class="empty">${list.length?"Ничего не найдено":"Список пока пуст"}</div>`}</div>
    ${items.length>st.limit?`<div class="more"><button class="btn ghost" data-act="more">Показать ещё (${items.length-st.limit})</button></div>`:""}`;
}

function card(x){
  const wish = isWish(x,st.sec);
  const my = num(x.my);
  const badge = wish ? `<div class="my wish">${st.sec==="books"?"прочитать":"посмотреть"}</div>` : my!=null ? `<div class="my ${cls(my)}">★ ${my}</div>` : "";
  const sub = [x.year, st.sec==="books"?x.author:x.director].filter(Boolean).join(" · ");
  const kp = num(x.kpRating), im = num(x.imdbRating);
  const rates = st.sec==="movies" && (kp!=null||im!=null) ? `<div class="rates">
      ${kp!=null?`<span class="rate kp ${cls(kp)}">КП ${fmt(kp)}</span>`:""}
      ${im!=null?`<span class="rate imdb">IMDb ${fmt(im)}</span>`:""}</div>` : "";
  return `<div class="card" data-id="${esc(x.id)}"><div class="poster">${posterHTML(x)}${badge}</div>
    <h3>${esc(x.title)}</h3><div class="sub">${esc(sub)}</div>${rates}</div>`;
}

/* ======== КАРТОЧКА ======== */
const dur = m => m ? (m>=60 ? `${Math.floor(m/60)} ч ${m%60} мин` : `${m} мин`) : "";
const votes = n => n>=1e6 ? (n/1e6).toFixed(1).replace(".0","")+" млн" : n>=1e3 ? Math.round(n/1e3)+" тыс" : String(n);
function titlesHTML(x){
  const rows = [];
  if (x.titleEn && x.titleEn!==x.title) rows.push(["EN", x.titleEn]);
  if (x.original && x.original!==x.title && x.original!==x.titleEn) rows.push(["Ориг.", x.original]);
  return rows.map(([k,v])=>`<div class="orig"><span class="olbl">${k}</span>${esc(v)}</div>`).join("");
}
const descCache = {};
function loadDesc(kpId){
  const n = String(+kpId % 32).padStart(2,"0");
  if (!descCache[n]) descCache[n] = fetch(`data/desc/${n}.json`).then(r=>r.ok?r.json():{}).catch(()=>({}));
  return descCache[n].then(m=>m[kpId]);
}
function openDetail(id, skipLoad){
  const x = data[st.sec].find(i=>i.id===id); if(!x) return;
  if (!skipLoad && st.sec==="movies" && x.kpId && x.description===undefined) {
    loadDesc(x.kpId).then(d=>{ x.description = d ? d[0] : ""; if (d && d[1] && !x.tagline) x.tagline = d[1];
      if (document.querySelector(`.det[data-id="${CSS.escape(id)}"]`)) openDetail(id, true); });
  }
  const books = st.sec==="books", my = num(x.my);
  const meta = (books
    ? [["Автор",x.author],["Год",x.year],["Прочитано",x.done]]
    : [["Режиссёр",x.director],["Страна",x.country],["Год",x.year],["Длительность",dur(x.duration)],["Просмотрено",x.done]]
  ).filter(r=>r[1]).map(([k,v])=>`<b>${k}:</b> ${esc(v)}`).join("<br>");
  const rates = books
    ? `<a class="br" href="${esc(llUrl(x))}" target="_blank" rel="noopener"><small>LiveLib</small><b>${x.livelibRating?fmt(num(x.livelibRating)):"→"}</b></a>`
    : `<a class="br" href="${esc(kpUrl(x))}" target="_blank" rel="noopener"><small>Кинопоиск</small><b class="${cls(num(x.kpRating))}">${fmt(num(x.kpRating))}</b></a>
       <a class="br" href="${esc(imdbUrl(x))}" target="_blank" rel="noopener"><small>IMDb</small><b style="color:var(--imdb)">${fmt(num(x.imdbRating))}</b>${x.imdbVotes?`<em class="votes">${votes(x.imdbVotes)}</em>`:""}</a>`;
  showModal(`<button class="iconbtn mx" data-act="close">✕</button>
    <div class="det" data-id="${esc(x.id)}">
      <div class="poster">${posterHTML(x)}</div>
      <div>
        <h2>${esc(x.title)}</h2>${titlesHTML(x)}
        <div class="bigrates">
          <div class="br"><small>Моя оценка</small><b class="${cls(my)}">${my!=null?my+"/10":"—"}</b></div>${rates}
        </div>
        <div class="meta">${meta}</div>
        <div class="dtags">${(x.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
        ${x.tagline?`<div class="tagline">«${esc(x.tagline)}»</div>`:""}
        ${x.description?`<div class="sec"><h4>Описание</h4><p>${esc(x.description)}</p></div>`:""}
        ${x.review?`<div class="sec"><h4>Мой отзыв</h4><p class="review">${esc(x.review)}</p></div>`:""}
        ${st.edit?`<div class="mactions"><button class="btn" data-act="edit" data-id="${esc(x.id)}">Редактировать</button><button class="btn danger" data-act="del" data-id="${esc(x.id)}">Удалить</button></div>`:""}
      </div>
    </div>`);
}

/* ======== РЕДАКТОР ======== */
const FIELDS = {
  movies:[["title","Название *"],["titleEn","Название на английском"],["original","Оригинальное название"],["year","Год"],["director","Режиссёр"],["country","Страна"],["done","Когда смотрел"],
          ["my","Моя оценка (0–10)"],["poster","Ссылка на постер"],["kpId","ID Кинопоиска","число из ссылки kinopoisk.ru/film/ID"],["kpRating","Рейтинг Кинопоиска"],
          ["imdbId","ID IMDb","tt… из ссылки imdb.com/title/tt…"],["imdbRating","Рейтинг IMDb"]],
  books:[["title","Название *"],["original","Оригинальное название"],["author","Автор"],["year","Год издания"],["done","Когда прочитал"],["my","Моя оценка (0–10)"],
         ["poster","Ссылка на обложку"],["livelib","Ссылка на LiveLib"],["livelibRating","Рейтинг LiveLib"]]
};
function openForm(id){
  const s = st.sec, x = id ? data[s].find(i=>i.id===id) : {tags:[]};
  const allTags = [...new Set([...SECTIONS[s].tagGroups.flatMap(g=>g[1]), ...data[s].flatMap(i=>i.tags||[])])];
  showModal(`<button class="iconbtn mx" data-act="close">✕</button>
  <form id="f">
    <h2>${id?"Редактирование":"Новая запись"}</h2>
    ${FIELDS[s].map(([k,l,h])=>`<label>${l}<input name="${k}" value="${esc(x[k]??"")}" ${k==="title"?"required":""}>${h?`<span class="hint">${h}</span>`:""}</label>`).join("")}
    <label class="full">Теги (через запятую)<input name="tags" id="tagsIn" value="${esc((x.tags||[]).join(", "))}">
      <div class="sugg">${allTags.map(t=>`<button type="button" class="chip" data-sugg="${esc(t)}">${esc(t)}</button>`).join("")}</div></label>
    <label class="full">Описание<textarea name="description">${esc(x.description||"")}</textarea></label>
    <label class="full">Мой отзыв<textarea name="review">${esc(x.review||"")}</textarea></label>
    <div class="factions"><button class="btn" type="submit">Сохранить</button><button class="btn ghost" type="button" data-act="close">Отмена</button></div>
  </form>`);
  const tin = $("#tagsIn");
  const sync = () => { const cur = tin.value.split(",").map(t=>t.trim()).filter(Boolean);
    document.querySelectorAll("[data-sugg]").forEach(b=>b.classList.toggle("on",cur.includes(b.dataset.sugg))); };
  sync(); tin.addEventListener("input",sync);
  document.querySelectorAll("[data-sugg]").forEach(b=>b.onclick=()=>{
    let cur = tin.value.split(",").map(t=>t.trim()).filter(Boolean); const t=b.dataset.sugg;
    cur = cur.includes(t) ? cur.filter(c=>c!==t) : [...cur,t]; tin.value = cur.join(", "); sync();
  });
  $("#f").onsubmit = e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const rec = { ...(id?x:{}) };
    for (const [k,v] of Object.entries(fd)) {
      const val = String(v).trim();
      if (k==="tags") rec.tags = val.split(",").map(t=>t.trim()).filter(Boolean);
      else if (["year","my","kpRating","imdbRating","livelibRating"].includes(k)) { if(val==="") delete rec[k]; else rec[k] = +val.replace(",","."); }
      else if (val==="") delete rec[k]; else rec[k]=val;
    }
    if (!id) { rec.id = (rec.title.toLowerCase().replace(/[^a-zа-яё0-9]+/gi,"-").replace(/^-|-$/g,"") || "item") + "-" + Date.now().toString(36); rec.added = new Date().toISOString().slice(0,10); }
    const order = ["id","title","titleEn","original","year","author","director","country","tags","my","done","kpId","kpRating","imdbId","imdbRating","livelib","livelibRating","poster","description","review","added"];
    const clean = {}; order.forEach(k=>{ if(rec[k]!==undefined) clean[k]=rec[k] }); Object.keys(rec).forEach(k=>{ if(!(k in clean)) clean[k]=rec[k] });
    if (id) data[s] = data[s].map(i=>i.id===id?clean:i); else data[s].unshift(clean);
    saveDraft(s); closeModal(); render();
  };
}
function saveDraft(s){ drafts[s]=true; lsSet("media_draft_"+s, data[s]); }
function fileText(s){
  return `// ${SECTIONS[s].title} — данные для сайта MEDIA. Обновлено ${new Date().toISOString().slice(0,10)}\nwindow.${SECTIONS[s].varName} = ${JSON.stringify(data[s],null,2)};\n`;
}

/* ======== МОДАЛКА / СОБЫТИЯ ======== */
function showModal(html){ $("#modal").innerHTML = `<div class="ov" data-act="ovclose"><div class="modal">${html}</div></div>`; document.body.style.overflow="hidden"; }
function closeModal(){ $("#modal").innerHTML=""; document.body.style.overflow=""; }

document.addEventListener("click", e => {
  const ov = e.target.closest("[data-act]"), c = e.target.closest(".card"), tg = e.target.closest("[data-tag]");
  if (tg) { const t=tg.dataset.tag; st.tags.has(t)?st.tags.delete(t):st.tags.add(t); st.limit=PAGE; render(); return; }
  if (ov) {
    const a = ov.dataset.act, s = st.sec;
    if (a==="ovclose" && e.target!==ov) return;
    if (a==="close"||a==="ovclose") closeModal();
    if (a==="clear") { st.tags.clear(); st.limit=PAGE; render(); }
    if (a==="more") { st.limit+=PAGE*2; const y=scrollY; render(); scrollTo(0,y); }
    if (a==="add") openForm(null);
    if (a==="edit") openForm(ov.dataset.id);
    if (a==="del" && confirm("Удалить запись?")) { data[s]=data[s].filter(i=>i.id!==ov.dataset.id); saveDraft(s); closeModal(); render(); }
    if (a==="export") { const b=new Blob([fileText(s)],{type:"text/javascript"}); const l=document.createElement("a"); l.href=URL.createObjectURL(b); l.download=SECTIONS[s].file; l.click(); }
    if (a==="copy") navigator.clipboard?.writeText(fileText(s)).then(()=>alert("Скопировано — вставь в data/"+SECTIONS[s].file),()=>alert("Не удалось скопировать"));
    if (a==="reset" && confirm("Удалить локальные изменения и вернуть данные с сайта?")) { lsSet("media_draft_"+s,null); drafts[s]=false; data[s]=window[SECTIONS[s].varName]||[]; render(); }
    return;
  }
  if (c) openDetail(c.dataset.id);
});
document.addEventListener("input", e => { if (e.target.id==="q") { st.q=e.target.value; st.limit=PAGE; const p=e.target.selectionStart; render(); const q=$("#q"); q.focus(); q.setSelectionRange(p,p); } });
document.addEventListener("change", e => { if (e.target.id==="sort") { st.sort=e.target.value; st.limit=PAGE; render(); }
  if (e.target.id==="status") { st.status=e.target.value; st.limit=PAGE; render(); } });
document.addEventListener("keydown", e => { if (e.key==="Escape") closeModal(); });
$("#editToggle").onclick = () => { st.edit=!st.edit; lsSet("media_edit", st.edit||null); render(); };

function route(){ const h=location.hash.slice(1); st.sec = SECTIONS[h]?h:"movies"; st.tags.clear(); st.q=""; st.status="all"; st.limit=PAGE; closeModal(); render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);

/* ======== ФОН ИЗ ПОСТЕРОВ ======== */
function buildWall(){
  const all = (window.MEDIA_MOVIES||[]).filter(x=>x.poster);
  let pool = all.filter(x=>(x.tags||[]).includes("любимые") || num(x.my)>=9);
  if (pool.length < 60) pool = all;
  pool = pool.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const ROWS = 7, PER = 14;
  if (!pool.length) return;
  let k = 0, html = "";
  for (let r=0; r<ROWS; r++){
    const imgs = [];
    for (let i=0;i<PER;i++) imgs.push(pool[k++ % pool.length].poster);
    const strip = imgs.map(s=>`<img src="${esc(s)}" alt="" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'">`).join("");
    html += `<div class="row" style="--d:${140+r*17}s">${strip}${strip}</div>`;
  }
  $("#bgTilt").innerHTML = html;
}
buildWall();
$("#build").textContent = "· сборка " + BUILD;
route();
</script>
